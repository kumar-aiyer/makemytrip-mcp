name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # The suites assert on structure and arithmetic, never on live prices, and playwright
    # is imported lazily - so they need no browser, no network and no dependencies. The
    # live gate (tools/probe.py) cannot run here: MakeMyTrip's CDN answers datacenter IPs
    # with HTTP 403, which is exactly what a CI runner is.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parsers, arithmetic and tool surface
        run: python tests/test_parsers.py
      - name: Version reporting
        run: python tests/test_version.py
      - name: Watcher supervisor
        run: python tests/test_watch_server.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the Claude Desktop extension
        run: python tools/build_mcpb.py --no-npx
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundle
          path: dist/*.mcpb
